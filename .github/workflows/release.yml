name: Release

# Se lanza a mano desde la pestaña Actions. La versión sale de public/manifest.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Leer versión
        id: version
        run: echo "version=$(node -p "require('./public/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Empaquetar
        run: cd dist && zip -r "../world-boss-alarm-v${{ steps.version.outputs.version }}.zip" .

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "El release v$VERSION ya existe; sube la versión en manifest.json." >&2
            exit 1
          fi
          gh release create "v$VERSION" "world-boss-alarm-v$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
